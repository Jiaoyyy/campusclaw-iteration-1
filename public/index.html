<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusClaw 班级资料</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>CampusClaw</strong><span>班级资料</span><div class="spacer"></div><button id="theme" class="quiet" type="button">切换深浅色</button><button id="logout" class="quiet" type="button" hidden>退出</button></header>
<main><section id="login-panel" class="panel narrow"><p class="eyebrow">迭代 1</p><h1>登录班级资料库</h1><p>教师上传讲义，学生查看自己班的资料。</p><form id="login-form"><label>账号<input name="username" autocomplete="username" required placeholder="例如 teacher-a"></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button></form><p id="login-error" role="alert" class="error"></p></section>
<section id="workspace" hidden><div class="intro"><div><p class="eyebrow">我的班级资料</p><h1 id="welcome"></h1><p id="role-note"></p></div></div><div class="toolbar"><label class="search">搜索标题<input id="search" type="search" placeholder="输入讲义标题"></label><button id="view-toggle" class="quiet" type="button">切换列表/网格</button></div><div id="upload-panel" class="panel" hidden><h2>上传讲义</h2><p>支持 UTF-8 的 .txt 或 .md，最多 2 MiB。</p><form id="upload-form"><input name="file" type="file" accept=".txt,.md" required><button type="submit">上传到本班</button></form><p id="upload-message" role="status"></p></div><section class="panel"><h2>资料列表</h2><div id="materials" class="cards"></div></section><section id="detail" class="panel" hidden><button id="back" type="button" class="quiet">返回列表</button><h2 id="detail-title"></h2><div id="detail-body" class="markdown"></div><a id="download" class="download">下载原文件</a></section></section></main><script src="/app.js" type="module"></script></body></html>
