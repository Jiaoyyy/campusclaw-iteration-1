services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      DB_PATH: /app/data/app.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  app_data:
  app_uploads:
